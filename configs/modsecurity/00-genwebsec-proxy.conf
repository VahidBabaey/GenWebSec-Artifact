<IfModule !proxy_module>
    LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
</IfModule>
ProxyPass        /customapp/ http://127.0.0.1:8080/
ProxyPassReverse /customapp/ http://127.0.0.1:8080/
ProxyPass        /juice/ http://127.0.0.1:3000/
ProxyPassReverse /juice/ http://127.0.0.1:3000/
ProxyPass        /bwapp/ http://127.0.0.1:8082/
ProxyPassReverse /bwapp/ http://127.0.0.1:8082/
