# CG-Static seed2  eps0.3  XSS  (union of 5 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`]|\b(alert|prompt|confirm)\b|(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[|\.constructor\b|\[\]\.constructor\.constructor|String\.fromCharCode|\][`)])" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS string breakout or JS execution sink invocation or obfuscated sink call'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b\s*(?:\(|`))|(?:\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b))" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink invocation including indirect and obfuscated calls'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(constructor|Function)\s*\(\s*(?:'[^']*'|\"[^\"]*\"|`[^`]*`)\s*\)\s*\(" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'XSS indirect JS execution sink via constructor call'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`]" "id:1000004,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'XSS direct JS execution sink call'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b" "id:1000005,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'XSS indirect JS sink identifier presence'"
