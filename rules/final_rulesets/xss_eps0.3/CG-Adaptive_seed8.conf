# CG-Adaptive seed8  eps0.3  XSS  (union of 6 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`])" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink call'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:\b|[^a-zA-Z0-9_])(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`]|(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[|\.constructor\b|\[\]\.constructor\.constructor\(|String\.fromCharCode|\]\s*`|[.,]\s*`|(?:map|forEach|find|flatMap|some|every|reduce|Array\.from|Reflect\.apply|then|forEach\.call)\s*\(|\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b)" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink invocation including obfuscation and indirect calls'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*([\(`])" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS sink call with parentheses or template literal invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\+\\s*`|\\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\\s*\\(|\\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\\s*`|\\b(window|top|self|globalThis|document|parent|frames|opener)\\s*\\[|\\.constructor\\b|\\[\\]\\.constructor\\.constructor\\(|String\\.fromCharCode|\\\\+')" "id:1000004,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sink calls and obfuscated invocations including JS-string breakout'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \(\s*[^()]*\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b" "id:1000005,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect JS sink invocation with bare sink name inside parentheses'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b|(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[|\.constructor\b|\[\]\.constructor\.constructor\(|String\.fromCharCode|\][ \t]*`|\)[ \t]*`" "id:1000006,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JavaScript execution sink calls or obfuscated invocations'"
