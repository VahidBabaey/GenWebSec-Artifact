# CG-Adaptive seed9  eps0.3  XSS  (union of 3 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|\\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\\s*[(\`]|(window|top|self|globalThis|document)\\s*\\[|\\.constructor\\b|\\[\\]\\.constructor\\.constructor\\(|String\\.fromCharCode|[\\]\\)]\\s*`|\\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\\b)" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS string breakout and JS execution sink calls including obfuscated and indirect invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*(\(|`)" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sink called with ( or template literal'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\+{1,}'){1}|(?:\b(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`])|\b(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b|(?:\b(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[)|(?:\.\s*constructor\b)|(?:\[\]\.constructor\.constructor\s*\()|(?:String\.fromCharCode)|(?:[\]\)]\s*`)" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sinks and JS-string breakout'"
