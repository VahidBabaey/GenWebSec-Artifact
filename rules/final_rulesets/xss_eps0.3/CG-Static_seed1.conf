# CG-Static seed1  eps0.3  XSS  (union of 6 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'[^\\S\\r\\n]*//|(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)[\\s\\n\\r]*[(\`]|(?:window|top|self|globalThis|document|parent|frames|opener)[\\s\\n\\r]*\\[|\\.constructor\\b|\\[\\]\\.constructor\\.constructor|String\\.fromCharCode|\\][\\s\\n\\r]*`|\\)[\\s\\n\\r]*`|\\b(alert|prompt|confirm)\\b)" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS string breakout or JS execution sink call or obfuscated sink invocation'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|\\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\\s*[(\`]|(window|top|self|globalThis|document)\\s*\\[|\\.constructor\\b|\\[\\]\\.constructor\\.constructor\\s*\\(|String\\.fromCharCode|\\]\\s*\\`|\\)\\s*\\`|\\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\\b)" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS string breakout or JS sink invocation including obfuscated and indirect calls'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(?:alert|prompt|confirm)\s*[\(`]|(?:\[\]\s*|[({]\s*|\b\w+\.\w+\s*)constructor\s*\(\s*['\"]?(?:return\s+)?(?:al(?:ert)?|pr(?:ompt)?|co(?:nfirm)?)" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect JS sink invocation via constructor calls'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \.constructor\s*\(\s*['\"](?:al(?:ert)?|prom(?:pt)?|conf(?:irm)?)" "id:1000004,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS sink invocation via constructor string argument obfuscation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(?:alert|prompt|confirm)\b" "id:1000005,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect JS sink invocation by bare sink name'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b" "id:1000006,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect bare JS sink identifier indicating indirect invocation'"
