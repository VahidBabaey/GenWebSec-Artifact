# CG-Adaptive seed4  eps0.3  XSS  (union of 4 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*(?:\(|`))" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink call'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|\\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\\s*[(\`]|(?:window|top|self|globalThis|document|parent|frames|opener)\\s*\\[|\\.constructor\\b|\\[\\]\\.constructor\\.constructor\\(|String\\.fromCharCode|\\]\\s*\\`|\\)\\s*\\`|\\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\\b)" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink call or indirect invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \[\]\.(?:filter|reduce|slice|constructor|map|forEach|find|flatMap|some|every|reduceRight|slice|splice|concat|push|pop|shift|unshift|sort|reverse|join|split|toString|valueOf|constructor)\.constructor\s*\(" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect JS execution via array prototype constructor call'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\+\\s*')|(\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`])|(\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b)|(\[\]\.constructor\.constructor\s*\()" "id:1000004,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sinks and JS-string breakout'"
