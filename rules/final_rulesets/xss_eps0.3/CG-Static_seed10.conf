# CG-Static seed10  eps0.3  XSS  (union of 4 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'[^\\w]*//)|((?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`])|((?:window|top|self|globalThis|document|parent|frames|opener)\s*\[)|(\.constructor\b)|(\[\]\.constructor\.constructor\s*\()|(String\.fromCharCode)|(\]\s*`)|(\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b)" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink call or obfuscated/indirect JS sink invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b\s*(\(|`)|\b(map|forEach|filter|flatMap|some|every|reduce|Array\.from|Reflect\.apply|then|forEach\.call)\b\s*\([^)]*\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect and direct JS execution sink calls via higher-order functions or direct invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \(\s*0\s*,\s*(Function|(?:\(\s*\(\)\s*=>\s*\{\s*\}\s*\))\.__proto__\.constructor)\s*\)\s*\(" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect Function/constructor invocation with indirect call syntax'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\+'){1,}|(\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`])|((window|top|self|globalThis|document|parent|frames|opener)\s*\[)|(\.constructor\b)|(\[\]\.constructor\.constructor\s*\()|(String\.fromCharCode)|(\]\s*`)|(\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b)" "id:1000004,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sinks and JS-string breakout attempts'"
