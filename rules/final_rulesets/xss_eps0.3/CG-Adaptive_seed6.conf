# CG-Adaptive seed6  eps0.3  XSS  (union of 3 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|\\b(alert|prompt|confirm|eval|setTimeout|setInterval|Function|constructor|write|print)\\s*[(\`])" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or direct sink call'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b\s*(\(|`))|(\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b))" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS string breakout or JS execution sink invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (?:\[\]\s*\[\s*'map'\s*\]\s*\[\s*'constructor'\s*\]|(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[|\.constructor\b|\[\]\.constructor\.constructor|String\.fromCharCode|\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`]|\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b)" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sink calls and obfuscated invocations'"
