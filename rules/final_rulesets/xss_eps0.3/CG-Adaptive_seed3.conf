# CG-Adaptive seed3  eps0.3  XSS  (union of 5 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:\b(Function|alert|prompt|confirm|print|eval|setTimeout|setInterval|constructor|write)\b\s*(?:\(|`)))" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink call'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[|\.constructor\b|\[\]\.constructor\.constructor\(|String\.fromCharCode|(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*[\(`]|(?:\balert\b|\bprompt\b|\bconfirm\b|\beval\b|\bsetTimeout\b|\bsetInterval\b|\bFunction\b|\bconstructor\b|\bwrite\b))" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (?:\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*(?:\(|`)|(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[|\.constructor\b|\[\]\.constructor\.constructor\s*\(|String\.fromCharCode|\]\s*`|\)\s*`|\\+')" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sinks, obfuscation, and JS-string breakout'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \(\s*(?:[^\(\)]*,\s*)?(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*\)" "id:1000004,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect invocation of JS sink via parentheses and comma operator'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b" "id:1000005,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sink identifiers for direct or indirect invocation'"
