# CG-Static seed8  eps0.3  XSS  (union of 6 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[|\.constructor\b|\[\]\.constructor\.constructor|String\.fromCharCode|\]\s*`|\)\s*`|(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*(?:\(|`)|\b(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b))" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS string breakout or JS execution sink call or indirect invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*(?:\(|`)" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sinks called via direct or indirect constructor or template literal invocation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \(\s*0\s*,\s*(Function|\(\s*\(\s*\)\s*=>\s*\{\s*\}\s*\)\.constructor)\s*\)\s*\(\s*(?:'[^']*'\s*\+\s*)*'[^']*'\s*\)\s*\(\s*\)" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Indirect JS sink invocation via Function/constructor with string concatenation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \(\s*1\s*,\s*Function\s*\)\s*\(\s*(?:'[^']*'\s*\+\s*)*'[^']*'\s*\)\s*\(\s*\)" "id:1000004,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Indirect JS sink invocation via Function with leading 1 parameter and string concatenation'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(Function|constructor)\b" "id:1000005,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect JS sink invocation via Function or constructor'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b" "id:1000006,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'JS execution sink name detected as bare word or indirect invocation'"
