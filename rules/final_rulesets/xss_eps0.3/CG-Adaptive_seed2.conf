# CG-Adaptive seed2  eps0.3  XSS  (union of 5 rules across pages, re-IDed)
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*(?:\(|`))" "id:1000001,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink call'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (\\\\+'|(?:(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)(?:\s*(?:\(|`))|(?:window|top|self|globalThis|document|parent|frames|opener)\s*\[|\.constructor\b|\[\]\.constructor\.constructor\(|String\.fromCharCode|\]\s*`|\)\s*`|\b(alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b))" "id:1000002,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS-string breakout or JS execution sink invocation including indirect calls'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \b(Function|alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*(\(|`)" "id:1000003,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect direct JS execution sink call'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx \(\s*(?:0|1)\s*,\s*\(\s*\)\s*=>\s*(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*\)\s*\(`" "id:1000004,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect indirect JS sink invocation via arrow function and template literal call'"
# from page: calc
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (?:\\+'){1,}|(?:\b(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\s*(?:\(|`))|(?:\b(?:alert|prompt|confirm|print|eval|setTimeout|setInterval|Function|constructor|write)\b)" "id:1000005,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,phase:2,deny,log,msg:'Detect JS execution sink calls, indirect invocations, and JS-string breakout for XSS'"
