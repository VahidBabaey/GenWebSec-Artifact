# CG-Adaptive seed4  eps0.3  SQLi  (union of 6 rules across pages, re-IDed)
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx ['\"](--|#|;)" "id:1000001,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection COMMENT-BREAKOUT detected: quote followed by comment or terminator'"
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx ['\"] ?[;#-]{1,2}|['\"] ?/\*" "id:1000002,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection - comment breakout after quote'"
# from page: search
