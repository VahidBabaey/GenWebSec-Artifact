# CG-Adaptive seed1  eps0.3  SQLi  (union of 7 rules across pages, re-IDed)
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (?:'|\\d)(?:--|#|/\\*|;)" "id:1000001,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection COMMENT-BREAKOUT detected'"
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx ' *(--|#|;)" "id:1000002,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection COMMENT-BREAKOUT: quote followed by comment or terminator'"
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (?:'|\\d)(?:--|#|;|/\\*)" "id:1000003,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection - comment or terminator breakout'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx select\s+case\s+when\b.+?\bend\b\s*\)\s*[=!<>]{1,2}\s*\d+" "id:1000004,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQLi Disguised Tautology - SELECT CASE WHEN ... END comparison'"
# from page: product
