# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (?:'|\d)(--|#|/\\*|;)" "id:1000001,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection COMMENT-BREAKOUT detected'"
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (?:'|\")\s*[\;\-\#]" "id:1000002,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection COMMENT-BREAKOUT: quote followed by comment or terminator'"
# from page: search
