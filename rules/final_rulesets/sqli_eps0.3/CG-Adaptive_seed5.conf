# CG-Adaptive seed5  eps0.3  SQLi  (union of 5 rules across pages, re-IDed)
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx '(\-\-|#|;|\/)" "id:1000001,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQLi COMMENT-BREAKOUT: quote followed by comment or statement terminator'"
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx ' *(;|--|#|/\*)" "id:1000002,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection - comment breakout after quote'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx select\s+case\s+when\b.+?\bend\b\s*\)\s*[=!<>]{1,2}\s*\d+" "id:1000003,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQLi DISGUISED-TAUTOLOGY: select case when ... end compared to number'"
# from page: product
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx select\s+case\s+when\b.+?\bend\b\s*\)\s*[=!<>]{1,2}\s*\d+" "id:1000004,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQLi Disguised Tautology - SELECT CASE WHEN ... END comparison'"
# from page: filter
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx select\s+case\s+when\b.+?\bend\b\s*\)\s*[=!<>]{1,2}\s*\d+" "id:1000005,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection Disguised Tautology - SELECT CASE WHEN structure'"
