# CG-Adaptive seed10  eps0.3  SQLi  (union of 6 rules across pages, re-IDed)
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx (?:'|\\d)(?:--|#|;|/\\*)" "id:1000001,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection COMMENT-BREAKOUT detected: quote or number followed immediately by comment or terminator'"
# from page: login
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx ' ?(;|--|#|/\*)" "id:1000002,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection COMMENT-BREAKOUT detected: quote followed by comment or statement terminator'"
# from page: search
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx select\s+case\s+when\b.+?\bend\b\s*\)\s*[=!<>]{1,2}\s*\d+" "id:1000003,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQLi Disguised Tautology - SELECT CASE WHEN structure'"
# from page: product
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx select\s+case\s+when\b.+?\bend\b\s*\)\s*(=|!=|<>|>=|<=|<|>)\s*\d+" "id:1000004,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQL Injection Disguised Tautology Detected'"
# from page: product
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx select case when\b .+? \bend\b ?[=!<>]{1,2} ?\d+" "id:1000005,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQLi Disguised Tautology: select case when ... end compared to number'"
# from page: filter
SecRule ARGS|REQUEST_URI|QUERY_STRING "@rx select\s+case\s+when\b.+?\bend\b\s*\)\s*[=!<>]{1,2}\s*\d+" "id:1000006,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,t:lowercase,phase:2,deny,log,msg:'SQLi disguised tautology via select case when ... end comparison'"
